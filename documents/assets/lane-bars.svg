<svg width="760" height="380" viewBox="0 0 760 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="At-risk vs recovered by lane">
  <style>
    .t{font-family:Segoe UI,Arial,sans-serif}
    .ax{fill:#9aa4b2;font-size:11px}
    .lb{fill:#374151;font-size:12px;font-weight:600}
    .ti{fill:#111827;font-size:15px;font-weight:700}
  </style>
  <rect width="760" height="380" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="28" y="34" class="t ti">At-risk vs recovered by lane (₹)</text>

  <!-- legend -->
  <rect x="530" y="22" width="12" height="12" rx="3" fill="#f59e0b"/>
  <text x="548" y="32" class="t ax">At-risk</text>
  <rect x="612" y="22" width="12" height="12" rx="3" fill="#22c55e"/>
  <text x="630" y="32" class="t ax">Recovered</text>

  <!-- gridlines + y ticks -->
  <g stroke="#eef1f5" stroke-width="1">
    <line x1="60" y1="280" x2="740" y2="280"/>
    <line x1="60" y1="215" x2="740" y2="215"/>
    <line x1="60" y1="151" x2="740" y2="151"/>
    <line x1="60" y1="86" x2="740" y2="86"/>
  </g>
  <g class="t ax" text-anchor="end">
    <text x="52" y="284">₹0</text>
    <text x="52" y="219">₹25K</text>
    <text x="52" y="155">₹50K</text>
    <text x="52" y="90">₹75K</text>
  </g>

  <!-- bars -->
  <!-- Payments -->
  <rect x="92"  y="72"  width="34" height="208" rx="4" fill="#f59e0b"/>
  <rect x="132" y="276" width="34" height="4"   rx="2" fill="#22c55e"/>
  <text x="129" y="300" text-anchor="middle" class="t lb">Payments</text>
  <!-- Checkout -->
  <rect x="228" y="268" width="34" height="12"  rx="4" fill="#f59e0b"/>
  <rect x="268" y="266" width="34" height="14"  rx="4" fill="#22c55e"/>
  <text x="265" y="300" text-anchor="middle" class="t lb">Checkout</text>
  <!-- Subscriptions -->
  <rect x="364" y="276" width="34" height="4"   rx="2" fill="#f59e0b"/>
  <rect x="404" y="276" width="34" height="4"   rx="2" fill="#22c55e"/>
  <text x="401" y="300" text-anchor="middle" class="t lb">Subscriptions</text>
  <!-- Receivables -->
  <rect x="500" y="40"  width="34" height="240" rx="4" fill="#f59e0b"/>
  <rect x="540" y="223" width="34" height="57"  rx="4" fill="#22c55e"/>
  <text x="537" y="300" text-anchor="middle" class="t lb">Receivables</text>
  <!-- Dispute -->
  <rect x="636" y="241" width="34" height="39"  rx="4" fill="#f59e0b"/>
  <rect x="676" y="257" width="34" height="23"  rx="4" fill="#22c55e"/>
  <text x="673" y="300" text-anchor="middle" class="t lb">Dispute</text>

  <text x="28" y="352" class="t ax">Recovery is verified capture from the append-only ledger · at-risk is open exposure · figures from the demo dataset.</text>
</svg>
