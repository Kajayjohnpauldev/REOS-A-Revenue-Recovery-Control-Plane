<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ReOS — Revival Operating System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0d1830"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#3b6fe0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3b6fe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="92%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf0ff"/>
      <stop offset="100%" stop-color="#c7d6ff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#glow1)"/>
  <rect width="1200" height="340" rx="20" fill="url(#glow2)"/>

  <!-- Monogram -->
  <g transform="translate(64,74)">
    <rect width="72" height="72" rx="20" fill="url(#mark)"/>
    <text x="36" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1220">Re</text>
  </g>

  <!-- Wordmark + tagline -->
  <text x="156" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f5f8ff">Re<tspan fill="#9db4ff">OS</tspan></text>
  <text x="158" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="3" font-weight="600" fill="#7f93c9">REVIVAL OPERATING SYSTEM</text>

  <text x="64" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Recover more revenue.</text>
  <text x="64" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#9db4ff">Prove every rupee.</text>

  <text x="66" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8ea0cf">An AI revenue-recovery control plane for Razorpay merchants · Razorpay AI Buildathon</text>

  <!-- Abstract recovery curve -->
  <g transform="translate(760,70)" opacity="0.95">
    <polyline points="0,150 60,150 90,92 130,170 170,60 210,120 250,150 360,150" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="170" cy="60" r="5" fill="#22c55e"/>
    <circle cx="90" cy="92" r="4" fill="#3b82f6"/>
    <line x1="0" y1="180" x2="360" y2="180" stroke="#28324d" stroke-width="1"/>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6b7ba6">
      <text x="0" y="200">reconcile</text>
      <text x="150" y="200">recover</text>
      <text x="300" y="200">prove</text>
    </g>
  </g>
</svg>
